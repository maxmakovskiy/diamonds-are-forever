networks:
  diamonds-network:
    external: true

volumes:
  db-data:

services:
  diamonds:
    build:
      context: ./../
      dockerfile: ./compose/javalin/Dockerfile
    image: diamonds_are_forever_prod
    container_name: diamonds_are_forever_prod
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - diamonds-network
    expose:
      - ${DIAMONDS_APP_PORT}
    environment:
      - POSTGRES_USER=${POSTGRES_DB_USER}
      - POSTGRES_PASSWORD=${POSTGRES_DB_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB_NAME}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - DIAMONDS_APP_PORT=${DIAMONDS_APP_PORT}
      - VUE_FULLY_QUALIFIED_DOMAIN_NAME=${VUE_FULLY_QUALIFIED_DOMAIN_NAME}
    labels:
      - traefik.enable=true
      - traefik.http.routers.diamonds.entrypoints=https
      - traefik.http.routers.diamonds.rule=Host(`${DIAMONDS_FULLY_QUALIFIED_DOMAIN_NAME}`)

  postgresql:
    image: 'postgres:${POSTGRES_VERSION}'
    networks:
      - diamonds-network
    # TODO: add secrets management?
    # https://docs.docker.com/compose/how-tos/use-secrets/
    environment:
      - POSTGRES_USER=${POSTGRES_DB_USER}
      - POSTGRES_PASSWORD=${POSTGRES_DB_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB_USER}
    volumes:
      - ./../sql/:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diamonds"]
      interval: 2s
      timeout: 5s
      retries: 20

  diamonds-vue:
    build:
      context: ./../diamonds-vue
      dockerfile: ./../compose/vue/Dockerfile
    image: diamonds_vue_prod
    container_name: diamonds_vue_prod
    networks:
      - diamonds-network
    depends_on:
      - diamonds
    expose:
      - ${VUE_APP_PORT}
    labels:
      - traefik.enable=true
      - traefik.http.routers.diamonds-vue.entrypoints=https
      - traefik.http.routers.diamonds-vue.rule=Host(`${VUE_FULLY_QUALIFIED_DOMAIN_NAME}`)


